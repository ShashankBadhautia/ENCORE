[project]
name = "smartstore-ai"
version = "0.1.0"
description = "SmartStore360 edge AI node: CCTV -> 2D store map -> retail analytics"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "ultralytics>=8.4.131",
    "opencv-python>=4.10",
    "PyYAML>=6.0",
    "numpy>=1.24",
    # ByteTrack requirements. Ultralytics auto-installs these with pip, which
    # fails inside a uv venv, so they are declared explicitly.
    "lap>=0.5.12",
    "scipy>=1.10",
]

[project.scripts]
smartstore-layout = "smartstore.layout:main"
smartstore-scan = "smartstore.scanner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smartstore"]

[tool.uv]
package = true
